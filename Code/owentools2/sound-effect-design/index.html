<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sound Effect Design · OwenTools 2</title><link rel="stylesheet" href="styles.css"></head><body><header><a href="../index.html">ot<span>2</span></a><div><h1>Sound Effect Design</h1><p>Record or import a sound. Turn it into something weird.</p></div></header><main><section class="recorder"><div id="orb"><span id="time">00:00.0</span></div><div class="buttons"><button id="record">● Record</button><button id="stop" disabled>■ Stop</button><button id="play" disabled>▶ Play</button></div><label>Import audio <input id="audio-upload" type="file" accept="audio/*"></label><canvas id="wave"></canvas><p id="status">Microphone permission is requested only when you press Record.</p></section><section class="lab"><h2>Mutation rack</h2><div id="controls"></div><div class="presets"><button data-preset="robot">Tiny robot</button><button data-preset="monster">Basement monster</button><button data-preset="space">Space hallway</button><button data-preset="reset">Clean-ish</button></div><label class="reverse"><input id="reverse" type="checkbox"> Reverse playback</label><label class="reverse"><input id="normalize" type="checkbox" checked> Normalize export</label><label>Trim start <input id="trim-start" type="range" min="0" max="90" value="0">%</label><label>Trim end <input id="trim-end" type="range" min="10" max="100" value="100">%</label><button id="download" disabled>Download transformed WAV</button><p>Preview and export use the current effects. WAV rendering happens locally.</p></section></main><script src="app.js"></script><script src="upgrade.js"></script><script src="sweep.js"></script></body></html>
