<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zone Timeline Viewer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111c;
      --panel: #101d2a;
      --panel2: #0b1723;
      --line: rgba(151, 202, 255, 0.18);
      --text: #f5f9ff;
      --muted: rgba(226, 239, 255, 0.66);
      --gold: #ffd66b;
      --blue: #66a7ff;
      --red: #ff5d5d;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(circle at 50% 0, rgba(89, 166, 255, .15), transparent 34%), var(--bg); color: var(--text); }
    main { width: min(1260px, calc(100vw - 28px)); margin: 0 auto; padding: 18px 0 28px; display: grid; gap: 12px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 14px; }
    h1 { margin: 0; font-size: 22px; letter-spacing: .02em; text-transform: uppercase; }
    p { margin: 4px 0 0; color: var(--muted); font-weight: 700; }
    .panel { border: 1px solid var(--line); border-radius: 8px; background: linear-gradient(180deg, rgba(255,255,255,.045), transparent 42%), rgba(9, 20, 32, .86); box-shadow: 0 16px 34px rgba(0,0,0,.25); }
    .controls { display: grid; grid-template-columns: repeat(6, minmax(120px, 1fr)); gap: 10px; padding: 12px; }
    label { display: grid; gap: 5px; color: var(--muted); font-size: 10px; font-weight: 950; text-transform: uppercase; }
    input, select, button { min-height: 34px; border: 1px solid rgba(151,202,255,.22); border-radius: 6px; background: rgba(0,0,0,.24); color: var(--text); font: 850 12px inherit; padding: 7px 9px; }
    button { cursor: pointer; background: rgba(102,167,255,.16); }
    button:hover { border-color: rgba(102,167,255,.72); }
    .date-row { grid-column: span 2; display: grid; grid-template-columns: 1fr 1.8fr; gap: 8px; align-items: end; }
    .date-row input[type="range"] { padding: 0; }
    .status { padding: 0 12px 12px; color: var(--muted); font-size: 12px; font-weight: 800; }
    .layout { display: grid; grid-template-columns: minmax(360px, .9fr) minmax(420px, 1.1fr); gap: 12px; }
    .heat-wrap { padding: 12px; display: grid; gap: 10px; }
    .audit { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .audit div { border: 1px solid rgba(151,202,255,.12); border-radius: 6px; padding: 8px; background: rgba(0,0,0,.20); }
    .audit span { display: block; color: var(--muted); font-size: 9px; font-weight: 950; text-transform: uppercase; }
    .audit b { display: block; margin-top: 3px; font-size: 14px; }
    .zone-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; aspect-ratio: 1 / 1; }
    .zone-cell { border: 1px solid rgba(255,255,255,.16); border-radius: 7px; background: color-mix(in srgb, var(--blue) calc(100% - var(--heat, 0%)), var(--red) var(--heat, 0%)); display: grid; align-content: center; justify-items: center; gap: 3px; min-width: 0; color: #fff; text-shadow: 0 1px 5px rgba(0,0,0,.55); cursor: pointer; }
    .zone-cell.is-selected { outline: 2px solid var(--gold); box-shadow: 0 0 22px rgba(255,214,107,.26); }
    .zone-cell b { font-size: 24px; }
    .zone-cell span { font-size: 10px; font-weight: 950; text-transform: uppercase; }
    .zone-cell small { color: rgba(255,255,255,.76); font-weight: 850; }
    .events { padding: 12px; overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    th, td { padding: 7px 8px; border-bottom: 1px solid rgba(151,202,255,.10); text-align: right; white-space: nowrap; }
    th:first-child, td:first-child { text-align: left; }
    th { position: sticky; top: 0; background: #112235; color: var(--muted); text-transform: uppercase; font-size: 9px; z-index: 1; }
    .empty { padding: 18px; color: var(--muted); font-weight: 850; }
    @media (max-width: 980px) { .controls, .layout { grid-template-columns: 1fr; } .date-row { grid-column: auto; grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Zone Timeline Viewer</h1>
        <p>Strict as-of batter-facing zones. Opening Day baseline: 2026-03-26.</p>
      </div>
      <button id="loadDemoBtn" type="button">Load Tiny Demo</button>
    </header>

    <section class="panel">
      <div class="controls">
        <label>Statcast CSV<input id="csvInput" type="file" accept=".csv,text/csv" /></label>
        <label>Batter<select id="batterSelect"></select></label>
        <label>Pitch Type<select id="pitchSelect"></select></label>
        <label>Velocity<select id="veloSelect"></select></label>
        <label>Metric<select id="metricSelect">
          <option value="damage">Damage Score</option>
          <option value="hrPerBbe">HR/BBE</option>
          <option value="tbPerBbe">TB/BBE</option>
          <option value="barrelRate">Barrel Rate</option>
          <option value="hardHitRate">Hard Hit</option>
        </select></label>
        <label>Smoothing<select id="smoothingSelect"><option value="on">On</option><option value="off">Off</option></select></label>
        <div class="date-row">
          <label>As Of<input id="dateInput" type="date" min="2026-03-26" value="2026-03-26" /></label>
          <label>Timeline<input id="dateRange" type="range" min="0" max="0" value="0" /></label>
        </div>
      </div>
      <div id="status" class="status">Load a Statcast CSV to inspect zone history.</div>
    </section>

    <section class="layout">
      <section class="panel heat-wrap">
        <div id="audit" class="audit"></div>
        <div id="zoneGrid" class="zone-grid"></div>
      </section>
      <section class="panel events">
        <table>
          <thead>
            <tr><th>Date</th><th>Pitcher</th><th>Pitch</th><th>Zone</th><th>Result</th><th>EV</th><th>LA</th><th>Dist</th><th>Before</th><th>After</th></tr>
          </thead>
          <tbody id="eventBody"></tbody>
        </table>
      </section>
    </section>
  </main>

  <script>
    const OPENING_DAY = '2026-03-26';
    const els = {
      csv: document.getElementById('csvInput'),
      batter: document.getElementById('batterSelect'),
      pitch: document.getElementById('pitchSelect'),
      velo: document.getElementById('veloSelect'),
      metric: document.getElementById('metricSelect'),
      smoothing: document.getElementById('smoothingSelect'),
      date: document.getElementById('dateInput'),
      range: document.getElementById('dateRange'),
      status: document.getElementById('status'),
      audit: document.getElementById('audit'),
      grid: document.getElementById('zoneGrid'),
      events: document.getElementById('eventBody'),
      demo: document.getElementById('loadDemoBtn'),
    };
    let events = [];
    let selectedZone = 'middle|middle';
    const zoneOrder = [['high','inside'], ['high','middle'], ['high','outside'], ['middle','inside'], ['middle','middle'], ['middle','outside'], ['low','inside'], ['low','middle'], ['low','outside']];

    function parseCsv(text) {
      const rows = [];
      let row = [], value = '', quoted = false;
      for (let i = 0; i < text.length; i += 1) {
        const c = text[i], n = text[i + 1];
        if (quoted && c === '"' && n === '"') { value += '"'; i += 1; continue; }
        if (c === '"') { quoted = !quoted; continue; }
        if (!quoted && c === ',') { row.push(value); value = ''; continue; }
        if (!quoted && (c === '\n' || c === '\r')) {
          if (c === '\r' && n === '\n') i += 1;
          row.push(value); rows.push(row); row = []; value = ''; continue;
        }
        value += c;
      }
      if (value || row.length) { row.push(value); rows.push(row); }
      const headers = rows.shift()?.map((h) => h.trim()) || [];
      return rows.filter((r) => r.some(Boolean)).map((r) => Object.fromEntries(headers.map((h, i) => [h, r[i] ?? ''])));
    }
    const num = (v) => { const n = Number(v); return Number.isFinite(n) ? n : NaN; };
    const val = (row, keys) => keys.map((k) => row[k]).find((v) => v !== undefined && v !== '') ?? '';
    const hand = (v) => /^l/i.test(String(v)) ? 'L' : /^r/i.test(String(v)) ? 'R' : '';
    function pitchFamily(type) {
      const t = String(type || '').toUpperCase();
      if (['FF','SI','FC','FA'].includes(t)) return 'fastball_family';
      if (['SL','ST','CU','KC','SV','CS'].includes(t)) return 'breaking_family';
      if (['CH','FS','FO','SC'].includes(t)) return 'offspeed_family';
      return t ? 'other_family' : 'unknown_family';
    }
    function veloBucket(type, velo) {
      const t = String(type || '').toUpperCase(), v = Number(velo);
      if (!Number.isFinite(v)) return 'unknown_velo';
      if (['FF','SI','FC','FA'].includes(t)) return v < 93 ? 'below_93' : v < 95 ? '93_94' : v < 97 ? '95_96' : '97_plus';
      if (['SL','ST'].includes(t)) return v < 84 ? 'below_84' : v < 87 ? '84_86' : v < 90 ? '87_89' : '90_plus';
      if (['CU','KC','SV','CS'].includes(t)) return v < 78 ? 'below_78' : v < 82 ? '78_81' : v < 85 ? '82_84' : '85_plus';
      return v < 80 ? 'below_80' : v < 86 ? '80_85' : v < 92 ? '86_91' : '92_plus';
    }
    function zoneFor(row) {
      const x = num(val(row, ['plate_x'])), z = num(val(row, ['plate_z'])), top = num(val(row, ['sz_top'])), bot = num(val(row, ['sz_bot']));
      const stand = hand(val(row, ['stand']));
      const zn = Number(val(row, ['zone']));
      let vertical = 'middle';
      if (Number.isFinite(z) && Number.isFinite(top) && Number.isFinite(bot) && top > bot) {
        const zNorm = (z - bot) / (top - bot);
        vertical = zNorm < 0.33 ? 'low' : zNorm < 0.66 ? 'middle' : 'high';
      } else if ([1,2,3,11,12].includes(zn)) vertical = 'high';
      else if ([7,8,9,13,14].includes(zn)) vertical = 'low';
      let horizontal = 'middle';
      if (Number.isFinite(x)) horizontal = Math.abs(x) <= 0.28 ? 'middle' : stand === 'L' ? (x > 0.28 ? 'inside' : 'outside') : (x < -0.28 ? 'inside' : 'outside');
      else if ([1,4,7,11,13].includes(zn)) horizontal = 'inside';
      else if ([3,6,9,12,14].includes(zn)) horizontal = 'outside';
      return { vertical, horizontal, key: `${vertical}|${horizontal}` };
    }
    function derive(row) {
      const pitchType = String(val(row, ['pitch_type']) || '').toUpperCase();
      const event = String(val(row, ['events']) || '');
      const desc = String(val(row, ['description']) || '');
      const launchSpeed = num(val(row, ['launch_speed']));
      const z = zoneFor(row);
      const bbe = desc === 'hit_into_play' || Number.isFinite(launchSpeed);
      const tb = event === 'home_run' ? 4 : event === 'triple' ? 3 : event === 'double' ? 2 : event === 'single' ? 1 : 0;
      const velo = num(val(row, ['release_speed']));
      return {
        raw: row,
        eventId: [val(row, ['game_pk']), val(row, ['at_bat_number']), val(row, ['pitch_number']), val(row, ['batter']), val(row, ['pitcher'])].join(':'),
        date: String(val(row, ['game_date'])).slice(0, 10),
        gamePk: val(row, ['game_pk']),
        batterId: String(val(row, ['batter'])),
        batterName: val(row, ['player_name', 'batter_name', 'batter_name_mlbam']) || String(val(row, ['batter'])),
        pitcherId: String(val(row, ['pitcher'])),
        pitcherName: val(row, ['pitcher_name', 'player_name']) || String(val(row, ['pitcher'])),
        pitchType,
        pitchFamily: pitchFamily(pitchType),
        velo,
        veloBucket: veloBucket(pitchType, velo),
        zone: z,
        event,
        isHr: event === 'home_run',
        isXbh: ['double','triple','home_run'].includes(event),
        isBbe: bbe,
        isHard: Number.isFinite(launchSpeed) && launchSpeed >= 95,
        isBarrel: Number(val(row, ['launch_speed_angle'])) === 6,
        ev: launchSpeed,
        la: num(val(row, ['launch_angle'])),
        dist: num(val(row, ['hit_distance_sc'])),
        tb,
      };
    }
    function bayes(success, chances, priorRate, strength) {
      return (success + priorRate * strength) / Math.max(1, chances + strength);
    }
    function bucketStats(list, smoothing) {
      const bbe = list.filter((e) => e.isBbe);
      const hr = list.filter((e) => e.isHr).length;
      const xbh = list.filter((e) => e.isXbh).length;
      const hard = list.filter((e) => e.isHard).length;
      const barrels = list.filter((e) => e.isBarrel).length;
      const tb = list.reduce((s, e) => s + e.tb, 0);
      const s = smoothing ? 14 : 0;
      const hrPerBbe = smoothing ? bayes(hr, bbe.length, .045, s) : (bbe.length ? hr / bbe.length : 0);
      const tbPerBbe = smoothing ? (tb + 0.42 * s) / Math.max(1, bbe.length + s) : (bbe.length ? tb / bbe.length : 0);
      const barrelRate = smoothing ? bayes(barrels, bbe.length, .08, s) : (bbe.length ? barrels / bbe.length : 0);
      const hardHitRate = smoothing ? bayes(hard, bbe.length, .38, s) : (bbe.length ? hard / bbe.length : 0);
      const damage = Math.round(Math.min(100, (hrPerBbe / .18) * 38 + (tbPerBbe / 1.3) * 30 + (barrelRate / .22) * 18 + (hardHitRate / .65) * 14));
      return { pitches: list.length, bbe: bbe.length, hr, xbh, tb, hrPerBbe, tbPerBbe, barrelRate, hardHitRate, damage, lastHr: list.filter((e) => e.isHr).map((e) => e.date).sort().pop() || '' };
    }
    function filteredEvents(beforeDate = null) {
      const batter = els.batter.value, pitch = els.pitch.value, velo = els.velo.value;
      return events.filter((e) => (!batter || e.batterId === batter)
        && (!pitch || e.pitchType === pitch)
        && (!velo || e.veloBucket === velo)
        && (!beforeDate || e.date < beforeDate));
    }
    function buildDates() {
      const unique = [...new Set(events.map((e) => e.date).filter(Boolean).concat([OPENING_DAY]))].sort();
      const min = OPENING_DAY, max = unique[unique.length - 1] || OPENING_DAY;
      const days = [];
      for (let d = new Date(`${min}T12:00:00`), end = new Date(`${max}T12:00:00`); d <= end; d.setDate(d.getDate() + 1)) days.push(d.toISOString().slice(0, 10));
      els.range.max = String(Math.max(0, days.length - 1));
      els.range.dataset.days = JSON.stringify(days);
      els.date.max = days[days.length - 1] || OPENING_DAY;
    }
    function fillControls() {
      const batters = [...new Map(events.map((e) => [e.batterId, e.batterName || e.batterId])).entries()].sort((a,b) => a[1].localeCompare(b[1]));
      els.batter.innerHTML = batters.map(([id, name]) => `<option value="${id}">${name} (${id})</option>`).join('');
      const pitches = [...new Set(events.map((e) => e.pitchType).filter(Boolean))].sort();
      els.pitch.innerHTML = '<option value="">All</option>' + pitches.map((p) => `<option>${p}</option>`).join('');
      const velos = [...new Set(events.map((e) => e.veloBucket).filter(Boolean))].sort();
      els.velo.innerHTML = '<option value="">All</option>' + velos.map((v) => `<option>${v}</option>`).join('');
      buildDates();
    }
    function render() {
      const asof = els.date.value || OPENING_DAY;
      const smoothing = els.smoothing.value === 'on';
      const prior = filteredEvents(asof);
      const byZone = new Map(zoneOrder.map(([v,h]) => [`${v}|${h}`, []]));
      prior.forEach((e) => byZone.get(e.zone.key)?.push(e));
      const metrics = [...byZone.entries()].map(([key, list]) => [key, bucketStats(list, smoothing)]);
      const metric = els.metric.value;
      const max = Math.max(1, ...metrics.map(([, s]) => metric === 'damage' ? s.damage : s[metric] * 100));
      els.grid.innerHTML = zoneOrder.map(([v,h]) => {
        const key = `${v}|${h}`, s = byZone.get(key) ? bucketStats(byZone.get(key), smoothing) : bucketStats([], smoothing);
        const value = metric === 'damage' ? s.damage : s[metric] * 100;
        const label = metric === 'damage' ? String(Math.round(value)) : `${value.toFixed(1)}%`;
        return `<button class="zone-cell ${selectedZone === key ? 'is-selected' : ''}" data-zone="${key}" style="--heat:${Math.round((value / max) * 100)}%"><span>${h} ${v}</span><b>${label}</b><small>${s.bbe} BBE / ${s.hr} HR</small></button>`;
      }).join('');
      const selectedStats = bucketStats(byZone.get(selectedZone) || [], smoothing);
      const through = new Date(`${asof}T12:00:00`); through.setDate(through.getDate() - 1);
      els.audit.innerHTML = [
        ['As of', asof],
        ['Data through', through.toISOString().slice(0, 10)],
        ['Sample', `${selectedStats.pitches} pitches / ${selectedStats.bbe} BBE / ${selectedStats.hr} HR`],
        ['Last HR in cell', selectedStats.lastHr || '--'],
        ['Target game included', 'No'],
        ['Reliability', selectedStats.bbe >= 20 ? 'High' : selectedStats.bbe >= 10 ? 'Medium' : selectedStats.bbe >= 4 ? 'Low' : 'Very low'],
      ].map(([k,v]) => `<div><span>${k}</span><b>${v}</b></div>`).join('');
      const zoneEvents = events.filter((e) => e.batterId === els.batter.value && e.zone.key === selectedZone && (!els.pitch.value || e.pitchType === els.pitch.value) && (!els.velo.value || e.veloBucket === els.velo.value)).sort((a,b) => a.date.localeCompare(b.date));
      els.events.innerHTML = zoneEvents.map((e, idx) => {
        const before = bucketStats(zoneEvents.slice(0, idx), smoothing).damage;
        const after = bucketStats(zoneEvents.slice(0, idx + 1), smoothing).damage;
        return `<tr><td>${e.date}</td><td>${e.pitcherName}</td><td>${e.pitchType} ${Number.isFinite(e.velo) ? e.velo.toFixed(1) : ''}</td><td>${e.zone.key.replace('|','/')}</td><td>${e.event || e.raw.description || ''}</td><td>${Number.isFinite(e.ev) ? e.ev.toFixed(1) : '--'}</td><td>${Number.isFinite(e.la) ? e.la.toFixed(1) : '--'}</td><td>${Number.isFinite(e.dist) ? e.dist.toFixed(0) : '--'}</td><td>${before}</td><td>${after}</td></tr>`;
      }).join('') || '<tr><td colspan="10" class="empty">No contributing events for this selected zone.</td></tr>';
      els.status.textContent = `${events.length.toLocaleString()} pitches loaded. As-of mode uses only pitches before ${asof}.`;
    }
    function loadRows(rows) {
      events = rows.map(derive).filter((e) => e.date && e.batterId).sort((a,b) => a.date.localeCompare(b.date));
      fillControls();
      render();
    }
    els.csv.addEventListener('change', async () => {
      const file = els.csv.files?.[0];
      if (!file) return;
      loadRows(parseCsv(await file.text()));
    });
    els.grid.addEventListener('click', (e) => {
      const cell = e.target.closest('[data-zone]');
      if (!cell) return;
      selectedZone = cell.dataset.zone;
      render();
    });
    for (const el of [els.batter, els.pitch, els.velo, els.metric, els.smoothing, els.date]) el.addEventListener('change', render);
    els.range.addEventListener('input', () => {
      const days = JSON.parse(els.range.dataset.days || '[]');
      els.date.value = days[Number(els.range.value)] || OPENING_DAY;
      render();
    });
    els.demo.addEventListener('click', () => {
      const demo = `game_date,game_pk,at_bat_number,pitch_number,batter,pitcher,stand,pitch_type,release_speed,plate_x,plate_z,sz_top,sz_bot,events,description,launch_speed,launch_angle,hit_distance_sc,launch_speed_angle,pitcher_name,player_name
2026-03-26,1,1,1,123,900,R,SI,91.2,-0.02,2.5,3.5,1.6,,called_strike,,,,,Pitcher A,Demo Batter
2026-04-02,2,8,4,123,901,R,SI,90.8,-0.10,2.4,3.4,1.5,home_run,hit_into_play,104,27,392,6,Pitcher B,Demo Batter
2026-05-12,3,4,2,123,902,R,FF,96.1,-0.45,3.1,3.6,1.6,double,hit_into_play,101,19,318,5,Pitcher C,Demo Batter
2026-06-02,4,2,3,123,903,R,SI,90.1,-0.08,2.45,3.5,1.6,home_run,hit_into_play,106,29,401,6,Pitcher D,Demo Batter`;
      loadRows(parseCsv(demo));
    });
    els.audit.innerHTML = '<div><span>Status</span><b>No data loaded</b></div>';
    els.grid.innerHTML = '<div class="empty">Load a CSV or the tiny demo.</div>';
  </script>
</body>
</html>
